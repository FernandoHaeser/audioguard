site_name: audioguard
site_description: Garante faixa de audio (real ou silenciosa) em qualquer stream RTSP e entrega HLS pronto para qualquer player.
site_url: https://fernandohaeser.github.io/audioguard/
repo_url: https://github.com/FernandoHaeser/audioguard
repo_name: FernandoHaeser/audioguard
edit_uri: edit/develop/docs/

docs_dir: docs

extra_css:
  - assets/extra.css

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Alternar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Alternar para tema claro
  font:
    text: Geist
    code: Geist Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Visao geral: index.md
  - Arquitetura: ARCHITECTURE.md
  - Fontes / protocolos: SOURCES.md
  - Uso: USAGE.md
  - Integracoes: INTEGRATIONS.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: "#"
      title: Nesta pagina

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FernandoHaeser/audioguard

copyright: audioguard - projeto open-source, licenca MIT.
