<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>audioguard · Fluxo de integração</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequencia · Integracao</p>
    <h1>Deteccao, publicacao e troca de origem</h1>

    <svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines: Orquestrador=128, audioguard=352, Camera=584, Relay=800 -->
      <line x1="128" y1="128" x2="128" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="352" y1="128" x2="352" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="584" y1="128" x2="584" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="348" y="176" width="8" height="192" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="0.8"/>
      <rect x="796" y="368" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: Orquestrador -> audioguard (escreve config) -->
      <line x1="128" y1="176" x2="352" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M2: audioguard -> Camera (probe) -->
      <line x1="352" y1="232" x2="584" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3: Camera -> audioguard (return, sem audio) -->
      <line x1="584" y1="284" x2="356" y2="284" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M4: audioguard self-loop (escolhe modo) -->
      <path d="M 360 328 L 396 328 L 396 360 L 360 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M5: audioguard -> Relay (publish rtsp, link) -->
      <line x1="352" y1="404" x2="800" y2="404" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M6: Orquestrador -> Relay (health check) -->
      <line x1="128" y1="460" x2="796" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M7: Relay -> Orquestrador (return, 2 tracks) -->
      <line x1="796" y1="504" x2="132" y2="504" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M8: Orquestrador self-loop (troca origem, headline coral) -->
      <path d="M 136 540 L 172 540 L 172 572 L 136 572" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="176" y="160" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESCREVE CHANNEL.YAML</text>

      <rect x="420" y="216" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FFPROBE ORIGEM</text>

      <rect x="424" y="268" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEM FAIXA AUDIO</text>

      <rect x="404" y="336" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="456" y="346" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SILENCIO SINTETICO</text>

      <rect x="524" y="388" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="590" y="398" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH RTSP (VIDEO+AUDIO)</text>

      <rect x="412" y="444" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="462" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFICA SAUDE</text>

      <rect x="412" y="488" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="462" y="498" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 TRACKS OK</text>

      <rect x="180" y="548" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="236" y="558" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TROCA URI DE ORIGEM</text>

      <!-- Actor: Orquestrador (external) -->
      <rect x="56" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="78" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orquestrador</text>
      <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bridge, ciclo 60s</text>

      <!-- Actor: audioguard (focal) -->
      <rect x="280" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="288" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="308" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
      <text x="352" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">audioguard</text>
      <text x="352" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run-dir</text>

      <!-- Actor: Camera (input) -->
      <rect x="512" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="520" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="538" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
      <text x="584" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Camera</text>
      <text x="584" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rtsp, sem audio</text>

      <!-- Actor: Relay (store) -->
      <rect x="728" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="736" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="750" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RLY</text>
      <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Relay</text>
      <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rtsp local</text>

      <!-- Legend -->
      <line x1="56" y1="600" x2="944" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDA</text>

      <rect x="56" y="636" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="76" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ator focal</text>

      <rect x="196" y="632" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="208" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Ativacao</text>

      <line x1="312" y1="642" x2="340" y2="642" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="348" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Publicacao RTSP</text>

      <line x1="480" y1="642" x2="508" y2="642" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="516" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retorno</text>

      <line x1="600" y1="642" x2="628" y2="642" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="636" y="644" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Confirmacao final</text>
    </svg>
  </div>
</body>
</html>
