name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    # builda dentro de containers das distros-alvo de proposito: o binario
    # do PyInstaller linka contra a glibc da maquina que builda, e glibc e
    # forward-compatible mas nao backward-compatible. Cada entrada do matrix
    # gera um binario nomeado pelo codename, buildado com a glibc daquela
    # distro especifica - evita "GLIBC_X.XX not found" em producao mesmo
    # que, na pratica, o build do focal (glibc mais antiga) ja rode nas
    # distros mais novas tambem.
    strategy:
      fail-fast: false
      matrix:
        include:
          - codename: focal    # Ubuntu 20.04 LTS
            image: ubuntu:20.04
          - codename: noble    # Ubuntu 24.04 LTS
            image: ubuntu:24.04
          - codename: 26.04    # Ubuntu 26.04 LTS (Resolute Raccoon)
            image: ubuntu:26.04
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Instala python3 e ferramentas de build
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip python3-dev git binutils dpkg-dev curl

      - uses: actions/checkout@v4

      - name: Build binary + tar.gz
        run: ./scripts/build_binary.sh audioguard-${{ matrix.codename }}

      - name: Resolve versao do pacote
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0~dev+${GITHUB_SHA:0:7}"
          fi
          # dpkg nao aceita '-' fora de uma revisao debian no upstream version;
          # normaliza pre-release tipo "0.1.0-alpha.1" -> "0.1.0~alpha.1"
          echo "value=${V//-/\~}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: ./scripts/build_deb.sh "${{ steps.version.outputs.value }}" "audioguard-${{ matrix.codename }}"

      - uses: actions/upload-artifact@v4
        with:
          name: audioguard-${{ matrix.codename }}
          path: |
            dist/audioguard-${{ matrix.codename }}.tar.gz
            dist/audioguard-${{ matrix.codename }}.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: audioguard-*
          path: dist/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
          generate_release_notes: true
