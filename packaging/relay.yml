# Config minima do relay RTSP (MediaMTX) bundlado com o audioguard.
# Existe pra suportar output.mode: publish sem depender de infra externa -
# ver docs/INTEGRATIONS.md. So RTSP habilitado (unico protocolo que o
# audioguard usa hoje); demais listeners desligados pra reduzir superficie.

rtsp: yes
rtspAddress: 127.0.0.1:8554

rtmp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no

# aceita qualquer publish/read local sem autenticacao - o relay so escuta
# em 127.0.0.1 (ver audioguard-relay.service), nao exposto pra fora do host
paths:
  all_others:
