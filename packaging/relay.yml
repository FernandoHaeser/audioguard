# Config minima do relay RTSP/RTMP (MediaMTX) bundlado com o audioguard.
# Existe pra suportar output.mode: publish sem depender de infra externa -
# ver docs/INTEGRATIONS.md. RTSP e RTMP habilitados (protocolos que o
# audioguard suporta publicar hoje); demais listeners desligados pra
# reduzir superficie.

rtsp: yes
rtspAddress: 127.0.0.1:8554

rtmp: yes
rtmpAddress: 127.0.0.1:1935

hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no

# aceita qualquer publish/read local sem autenticacao - o relay so escuta
# em 127.0.0.1 (ver audioguard-relay.service), nao exposto pra fora do host
paths:
  all_others:
